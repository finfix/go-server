name: dev deploy

on:
  # Ручной перезапуск деплоя без нового коммита
  workflow_dispatch:
  push:
    branches:
      - release/*
      - hotfix/*

# id-token — вход в Vault по GitHub OIDC в reusable-deploy
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  general-deploy-pipeline:
    uses: bonavi/devops_common/.github/workflows/reusable-deploy.yml@main
    with:
      image_name: ${{ github.repository }}-dev
      make_command: deploy-coin-server-dev
      devops_repository: finfix/devops
      vault_role: gh-finfix-go-server-deploy-dev
      vault_kubeconfig_secret: coin/ci/kubeconfig-dev
      vault_pat_secret: coin/ci/github-pat
      vault_sops_secret: coin/ci/helmfile-sops
      vault_notify_secret: coin/ci/deploy-notify
      vault_wireguard_secret: coin/ci/wireguard
    secrets: inherit
